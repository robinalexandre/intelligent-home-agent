[project]
name = "intelligent-home-agent"
version = "0.1.0"
description = "Self-hosted voice and briefing agent: a language model with tools for Home Assistant, weather, outdoor activities, calendar, mail and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "caldav>=3.0",
    # Office files the user sends, read as text; defusedxml keeps the XML parsing safe
    # from entity tricks.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    # Pictures checked before they go to an image model (tools/generation.py); already
    # there, as python-pptx needs it.
    "pillow>=10",
]

[project.optional-dependencies]
# PDFs written, forms filled, pages copied, drawings rendered (docs/documents.md). The
# Docker image installs it; without it those tools are simply absent.
documents = [
    "fpdf2>=2.8.4",
    # Filling PDF forms: pypdf merges and fills, pdfminer.six gives the text's positions.
    "pypdf>=6.0",
    "pdfminer.six>=20250506",
    # Renders the drawings the agent writes in SVG (Rust, no system library, loads nothing
    # from the network).
    "resvg-py>=0.5",
]
# Animations as MP4 videos (PyAV brings its own FFmpeg, some 40 MB); GIFs without it.
video = ["av>=11"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    # The documents extra, so its tests run.
    "fpdf2>=2.8.4",
    "pypdf>=6.0",
    "pdfminer.six>=20250506",
    "resvg-py>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_home_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
