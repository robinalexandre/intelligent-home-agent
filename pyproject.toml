[project]
name = "intelligent-home-agent"
version = "0.1.0"
description = "Self-hosted voice and briefing agent: a language model with tools for Home Assistant, weather, outdoor activities, calendar, mail and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "caldav>=3.0",
    # Office files the user sends, read as text; defusedxml keeps the XML parsing safe
    # from entity tricks.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Home devices that rest on unofficial libraries (docs/home-devices.md). Each is pinned,
# since the vendor's side changes without notice; without its extra the device stays off.
# PetKit feeder and litter box, through the signed calls of PetKit's phone app.
petkit = ["pypetkitapi==1.31.1"]
# Google TV / Android TV devices, through the protocol of Google's TV remote app; Pillow
# for the screen read over ADB (tools/adb.py).
android-tv = ["androidtvremote2==0.3.3", "pillow>=10"]
# Apple TV and HomePods. srptools 2 changed the SRP session's signature pyatv 0.18 calls,
# so the AirPlay remote control channel fails with it.
apple = ["pyatv==0.18.0", "srptools==1.0.1"]
devices = [
    "pypetkitapi==1.31.1",
    "androidtvremote2==0.3.3",
    "pillow>=10",
    "pyatv==0.18.0",
    "srptools==1.0.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_home_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
