[project]
name = "intelligent-home-agent"
version = "0.1.0"
description = "Self-hosted voice and briefing agent: a language model with tools for Home Assistant, weather, outdoor activities, calendar, mail and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "caldav>=3.0",
    # Office files the user sends, read as text; defusedxml keeps the XML parsing safe
    # from entity tricks.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Memory kept in a GitHub repository that encrypts its folder with git-crypt
# (MEMORY_CRYPT_KEY, docs/memory.md); nothing else needs it.
crypt = [
    "cryptography>=42",
]
dev = [
    "cryptography>=42",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_home_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Runs the installed git-crypt, when there is one, to check the codec against it.
"tests/test_config_crypt.py" = ["S105", "S106", "S603", "S607"]
