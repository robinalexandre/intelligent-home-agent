[project]
name = "intelligent-home-agent"
version = "0.1.0"
description = "Self-hosted voice and briefing agent: a language model with tools for Home Assistant, weather, outdoor activities, calendar, mail and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "caldav>=3.0",
    # Calendar events written and read (tools/calendar.py), CardDAV answers (tools/contacts.py).
    "icalendar>=6.0",
    "lxml>=5.0",
    # Office files the user sends, read as text; defusedxml keeps the XML parsing safe
    # from entity tricks.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    # Investigations (tools/osint.py): a photo's metadata and the copy put online for a
    # reverse image search, a PDF's author and dates, a site's DNS records. Pillow and pypdf
    # also serve the documents the agent makes (tools/documents.py, pdf_pages.py), and pypdf
    # the text of the PDFs in a drive (drive_content.py).
    "pillow>=10",
    "pypdf>=6.0",
    "dnspython>=2.6",
    # The WhatsApp chat (whatsapp.py): poll votes and reactions come over WAHA's socket.
    "websockets>=13",
]

[project.optional-dependencies]
# Memory kept in a GitHub repository that encrypts its folder with git-crypt
# (MEMORY_CRYPT_KEY, docs/memory.md); nothing else needs it.
crypt = [
    "cryptography>=42",
]
# PDFs written, forms filled, drawings rendered (docs/documents.md). The Docker image
# installs it; without it those tools are simply absent.
documents = [
    "fpdf2>=2.8.4",
    # Filling PDF forms: pdfminer.six gives the text's positions.
    "pdfminer.six>=20250506",
    # Renders the drawings the agent writes in SVG (Rust, no system library, loads nothing
    # from the network).
    "resvg-py>=0.5",
]
# Home devices that rest on unofficial libraries (docs/home-devices.md). Each is pinned,
# since the vendor's side changes without notice; without its extra the device stays off.
# PetKit feeder and litter box, through the signed calls of PetKit's phone app.
petkit = ["pypetkitapi==1.31.1"]
# Google TV / Android TV devices, through the protocol of Google's TV remote app; Pillow
# for the screen read over ADB (tools/adb.py).
android-tv = ["androidtvremote2==0.3.3", "pillow>=10"]
# Apple TV and HomePods. srptools 2 changed the SRP session's signature pyatv 0.18 calls,
# so the AirPlay remote control channel fails with it.
apple = ["pyatv==0.18.0", "srptools==1.0.1"]
devices = [
    "pypetkitapi==1.31.1",
    "androidtvremote2==0.3.3",
    "pillow>=10",
    "pyatv==0.18.0",
    "srptools==1.0.1",
]
# Apple Reminders, Notes and Find My through icloud.com's private API (docs/apple.md):
# pinned, as Apple changes that API without notice and each release follows.
icloud = ["pyicloud==2026.10.1"]
# Drives the remote browser (compose/browser.yml, docs/browser.md) over Chrome's control
# port; no browser is downloaded. Below 1.65, the last line known to drive the Chrome image
# pinned there: a newer release may speak a protocol that image lacks.
browser = ["playwright>=1.55,<1.65"]
# Claude on a Claude subscription instead of the API (ENGINE=subscription,
# docs/subscription.md): Claude Code through the Agent SDK, whose wheel brings the Claude
# Code binary (some 400 MB). Without it the feature is absent and the API answers.
subscription = ["claude-agent-sdk>=0.2"]
# Voice messages sent in a chat, transcribed on the server (WHISPER_MODEL, docs/chat.md).
# Without it a voice message gets a line asking to write instead. PyAV 19 dropped an
# argument faster-whisper 1.2.1 still passes to av.open.
voice = ["faster-whisper>=1.1", "av>=11,<19"]
# Animations as MP4 videos (PyAV brings its own FFmpeg, some 40 MB); GIFs without it.
video = ["av>=11"]
dev = [
    "cryptography>=42",
    # The tests of the iCloud apps use its exception types.
    "pyicloud==2026.10.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    # The documents extra, so its tests run.
    "fpdf2>=2.8.4",
    "pdfminer.six>=20250506",
    "resvg-py>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_home_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Runs the installed git-crypt, when there is one, to check the codec against it.
"tests/test_config_crypt.py" = ["S105", "S106", "S603", "S607"]
