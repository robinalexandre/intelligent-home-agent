# A local model served by Ollama, next to the agent: nothing leaves the machine.
# With LLM_PROVIDER=ollama and LLM_MODEL=<a model that supports tools>; pull it once with
#   docker compose exec ollama ollama pull <model>
# Ollama already running on the host instead? Skip this file and set
#   LLM_BASE_URL=http://host.docker.internal:11434/v1
services:
  agent:
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
    depends_on: [ollama]

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
