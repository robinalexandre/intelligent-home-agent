# A Tailscale node next to the agent, with nothing installed on the host. It does two jobs:
# - the agent reaches Home Assistant on your tailnet through it (HA_PROXY_URL), which is
#   how a VPS talks to a home that exposes nothing;
# - your devices on the tailnet reach the agent at https://<TS_HOSTNAME>.<tailnet>.ts.net
#   (compose/tailscale-serve.json). TS_SERVE=funnel in .env opens that address to the
#   whole internet instead (compose/tailscale-funnel.json), e.g. for a phone without the
#   Tailscale app; the tailnet policy must allow Funnel for this node.
# Needs TS_AUTHKEY in .env (admin console > Settings > Keys), and MagicDNS and HTTPS
# certificates enabled on the tailnet (admin console > DNS).
services:
  agent:
    environment:
      HA_PROXY_URL: http://tailscale:1055
    depends_on: [tailscale]

  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-home-agent}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-home-agent}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_OUTBOUND_HTTP_PROXY_LISTEN: 0.0.0.0:1055
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./compose/tailscale-${TS_SERVE:-serve}.json:/config/serve.json:ro
    restart: unless-stopped

volumes:
  tailscale_state:
