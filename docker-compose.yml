# The agent alone, listening on this machine only (127.0.0.1:8000). AGENT_BIND=0.0.0.0 in
# .env opens it to the home network in plain HTTP: never on a machine with a public address.
# Add one file from compose/ to choose how it is reached: scripts/setup.py writes the
# choice as COMPOSE_FILE in .env, so `docker compose up -d` is always the whole command.
# See docs/setup.md.
name: intelligent-home-agent

services:
  agent:
    build:
      context: .
      args:
        # Optional parts of the agent (the Dockerfile's EXTRAS). In .env, e.g.
        # EXTRAS=documents,devices adds the libraries of some home devices
        # (docs/home-devices.md), EXTRAS=documents,subscription Claude Code for a
        # Claude subscription (docs/subscription.md).
        # EXTRAS=documents,icloud is Apple Reminders, Notes and Find My (docs/apple.md).
        EXTRAS: "${EXTRAS:-documents}"
        # Debian packages a feature needs, e.g. SYSTEM_PACKAGES=adb for the TV navigator.
        SYSTEM_PACKAGES: "${SYSTEM_PACKAGES:-}"
    env_file: .env
    ports:
      - "${AGENT_BIND:-127.0.0.1}:8000:8000"
    # Lets the agent reach a service on the host itself (a local model server, Home
    # Assistant in host mode) as host.docker.internal, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # What must survive a restart, e.g. a connector's login when its server renews it.
      - agent_data:/app/data
    restart: unless-stopped

volumes:
  agent_data:
